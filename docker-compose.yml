services:
  postgres:
    image: postgres:16-alpine
    container_name: sgi-base-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: sgi
      POSTGRES_PASSWORD: sgi
      POSTGRES_DB: sgi_base
    volumes:
      - sgi_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sgi -d sgi_base"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sgi_pg_data:
