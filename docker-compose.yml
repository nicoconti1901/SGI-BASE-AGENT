services:
  postgres:
    image: postgres:16-alpine
    container_name: sgi-base-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: sgi
      POSTGRES_PASSWORD: sgi
      POSTGRES_DB: sgi_base
    volumes:
      - sgi_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sgi -d sgi_base"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: sgi-base-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: sgi
      MINIO_ROOT_PASSWORD: sgisecret123
    command: server /data --console-address ":9001"
    volumes:
      - sgi_minio_data:/data

volumes:
  sgi_pg_data:
  sgi_minio_data:
